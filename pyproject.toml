[project]
name = "marketsentinel"
version = "0.1.0"
description = "MarketSentinel"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.116",
    "feedparser>=6.0",
    "httpx>=0.28",
    "numpy>=2.2",
    "openai>=3.1.0",
    "pandas>=2.2",
    "plotly>=6.2",
    "pydantic-settings>=2.10",
    "requests>=2.32",
    "scikit-learn>=1.6",
    "streamlit>=1.47",
    "tenacity>=9.1",
    "torch>=2.7",
    "transformers>=4.50,<5",
    "uvicorn[standard]>=0.35",
    "yfinance>=0.2.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "-p",
    "no:cacheprovider",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["marketsentinel"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["src/marketsentinel"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
