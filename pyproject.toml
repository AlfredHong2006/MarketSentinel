[project]
name = "marketsentinel"
version = "0.1.0"
description = "Evidence-grounded company intelligence from financial news, corporate events, and market data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alfred Hong", email = "100234617+AlfredHong2006@users.noreply.github.com" },
]
keywords = [
    "financial-news",
    "event-extraction",
    "materiality",
    "sentiment-analysis",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.116",
    "feedparser>=6.0",
    "httpx>=0.28",
    "numpy>=2.2",
    "openai>=3.1.0",
    "pandas>=2.2",
    "plotly>=6.2",
    "pydantic-settings>=2.10",
    "requests>=2.32",
    "scikit-learn>=1.6",
    "tenacity>=9.1",
    "uvicorn[standard]>=0.35",
    "yfinance>=0.2.65",
]

# Optional extras keep the public read-only deployment lean. The public API is GET-only: it
# never scores sentiment (POST /api/v1/analyze returns 404 in public mode) and never imports
# the Streamlit client, so shipping PyTorch -- which on Linux drags in ~3GB of nvidia-* CUDA
# wheels -- would install code that cannot execute. Verified empirically: importing
# marketsentinel.api.app loads neither torch, transformers, nor streamlit.
#
# Full local development installs everything: uv sync --all-extras --dev
[project.optional-dependencies]
ml = [
    "torch>=2.7",
    "transformers>=4.50,<5",
]
dashboard = [
    "streamlit>=1.47",
]

[project.urls]
Homepage = "https://github.com/AlfredHong2006/MarketSentinel"
Repository = "https://github.com/AlfredHong2006/MarketSentinel"
Issues = "https://github.com/AlfredHong2006/MarketSentinel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "-p",
    "no:cacheprovider",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["marketsentinel"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["src/marketsentinel"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
