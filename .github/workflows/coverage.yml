name: Scheduled Coverage

# Continuous coverage for the prepared tickers, run privately here (OpenAI credentials live only
# in this workflow, never on the public Render service) then published as a sanitized public
# snapshot to Cloudflare R2. See docs/architecture/ARCHITECTURE.md#continuous-coverage and
# docs/decisions/DECISIONS.md for the ledger semantics this drives, and the "Scheduled coverage
# and public snapshot publication" decision for why this workflow is shaped the way it is.
#
# No automated Git writes: this workflow never commits or pushes. The only durable state it
# produces lives in Cloudflare R2 (private operational database, public snapshot) and, on success,
# a Render service restart so the public deployment picks the new snapshot up.

on:
  schedule:
    # Every 6 hours. Change the cron expression to change cadence; nothing else in this workflow
    # depends on the specific schedule.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers always kept under coverage (activated every run)"
        default: "NVDA,PFE"
      max_new:
        description: "Max new analyses per ticker this run"
        default: "25"
      max_new_total:
        description: "Hard cap on paid analyses across all tickers this run"
        default: "40"
      max_tickers:
        description: "Max tickers cycled this run (round-robin across runs)"
        default: "12"
      max_new_tickers:
        description: "Max companies newly activated from public requests this run"
        default: "3"
      max_article_requests:
        description: "Max public article analysis requests processed this run"
        default: "20"

# A second overlapping run would race the same private SQLite database and the same R2 objects.
# cancel-in-progress stays false so a run already in flight finishes rather than being cut off
# mid-write; the next scheduled trigger simply queues behind it.
concurrency:
  group: scheduled-coverage
  cancel-in-progress: false

permissions:
  contents: read

# Every spend-relevant number is a dispatch input with a default, so the worst case per run is
# fixed here and changeable without touching Python: at most MAX_NEW_TOTAL cycle analyses plus
# MAX_ARTICLE_REQUESTS explicit article analyses, whatever the public request queue holds.
env:
  TICKERS: ${{ github.event.inputs.tickers || 'NVDA,PFE' }}
  MAX_NEW: ${{ github.event.inputs.max_new || '25' }}
  MAX_NEW_TOTAL: ${{ github.event.inputs.max_new_total || '40' }}
  MAX_TICKERS: ${{ github.event.inputs.max_tickers || '12' }}
  MAX_NEW_TICKERS: ${{ github.event.inputs.max_new_tickers || '3' }}
  MAX_ARTICLE_REQUESTS: ${{ github.event.inputs.max_article_requests || '20' }}
  # Mapped to env because the secrets context is not available in a step-level `if`. Empty
  # (unset secret) means no request bucket is configured and every request step is skipped.
  R2_REQUESTS_BUCKET: ${{ secrets.R2_REQUESTS_BUCKET }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --all-extras: the coverage cycle scores sentiment with FinBERT (the `ml` extra), which the
      # lean public-deployment install intentionally excludes.
      - name: Install Python 3.11 and dependencies
        run: uv sync --locked --all-extras --dev

      # Fails closed on a missing private database: this is the accumulated, already-paid-for
      # analysis corpus, so a run must never silently start over from empty (that would both lose
      # history and re-pay for analyses the ledger already has). The constituent cache is
      # different -- free, public, reference-only data with no cost or paid state attached to it
      # -- so it alone keeps a soft fallback below.
      - name: Download private state from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p data
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_PRIVATE_BUCKET }}"

          if ! aws s3 cp "$BUCKET/state/marketsentinel.db" data/marketsentinel.db \
              --endpoint-url "$ENDPOINT"; then
            echo "::error::No private operational database found at $BUCKET/state/marketsentinel.db." \
              "Refusing to bootstrap an empty database -- that would silently discard the existing" \
              "analysis corpus and cause re-paying for analyses already on record. Seed R2 manually" \
              "once before the first scheduled run: upload the current data/marketsentinel.db and" \
              "data/constituents_cache.json to state/marketsentinel.db and" \
              "state/constituents_cache.json in the private bucket (see README.md), then re-run."
            exit 1
          fi

          # Local copy of the pre-cycle state, uploaded as the rolling backup at checkpoint time.
          cp data/marketsentinel.db data/marketsentinel.db.bak

          aws s3 cp "$BUCKET/state/constituents_cache.json" data/constituents_cache.json \
            --endpoint-url "$ENDPOINT" \
            || echo "no prior constituent cache in R2 -- will warm it from Wikipedia"

      - name: Warm constituent cache if missing
        run: |
          IFS=',' read -ra TICKER_ARR <<< "$TICKERS"
          uv run python scripts/warm_constituent_cache.py "${TICKER_ARR[@]}"

      # activate_company_coverage is idempotent (see storage/sqlite.py): safe to call every run,
      # and it keeps the ticker's original ledger_started_at rather than resetting it.
      - name: Activate coverage
        run: |
          IFS=',' read -ra TICKER_ARR <<< "$TICKERS"
          ARGS=()
          for t in "${TICKER_ARR[@]}"; do ARGS+=(--ticker "$t"); done
          uv run python scripts/run_coverage_cycle.py --mode activate "${ARGS[@]}"

      # Shared public requests (marketsentinel/public_requests.py). The public deployment can only
      # *write* small request objects into this dedicated bucket; this is the only place they are
      # read. Synced to a directory first, so the admission step below needs no cloud credential.
      # A missing or empty bucket is not an error -- there is simply nothing queued. Skipped
      # entirely when no request bucket is configured.
      - name: Sync public requests from R2
        if: ${{ env.R2_REQUESTS_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          mkdir -p requests
          aws s3 sync "s3://${{ env.R2_REQUESTS_BUCKET }}/" requests/ \
            --endpoint-url "$ENDPOINT" --exclude "*" --include "coverage/*.json" \
            --include "articles/*.json"
          echo "synced $(find requests -name '*.json' | wc -l) request object(s)"

      # Admits queued requests under hard caps: at most MAX_NEW_TICKERS companies activated
      # (spends nothing -- the cycle below pays under its own caps) and at most
      # MAX_ARTICLE_REQUESTS explicit article analyses (real, capped spend, through the same
      # ledger the private endpoint uses). Writes the exact keys it consumed to
      # requests-consumed.txt; anything it did not reach stays in the bucket for a later run.
      - name: Admit public requests
        if: ${{ env.R2_REQUESTS_BUCKET != '' }}
        env:
          MARKETSENTINEL_LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run python scripts/run_coverage_cycle.py --mode requests \
            --requests-dir requests --consumed-keys requests-consumed.txt \
            --max-new-tickers "$MAX_NEW_TICKERS" --max-article-requests "$MAX_ARTICLE_REQUESTS"

      # Gate and checkpoint immediately after request admission, before the (usually much larger
      # and longer) all-active cycle below -- and before that step even exists in the job history
      # of a run that never reaches it. Admission's paid article-request analyses otherwise exist
      # only on this ephemeral runner's disk until the *later* checkpoint after the cycle; if the
      # cycle then died or the job hit its timeout, that paid work would be lost and re-paid for
      # on the next run's re-admission. Both steps are skipped, exactly like admission itself,
      # when no request bucket is configured -- there is nothing new to protect yet.
      - name: Validate private database integrity (after public requests)
        if: ${{ env.R2_REQUESTS_BUCKET != '' }}
        run: uv run python scripts/check_database_integrity.py data/marketsentinel.db

      # A non-zero exit here (after retries) stops the job: the coverage cycle below, and every
      # step after it, never runs against admitted work that was not actually saved.
      - name: Checkpoint private state to R2 (after public requests)
        if: ${{ env.R2_REQUESTS_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_PRIVATE_BUCKET }}"

          retry() {
            local attempt=1 max_attempts=5 delay=5
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::command failed after $max_attempts attempts: $*"
                return 1
              fi
              echo "attempt $attempt/$max_attempts failed, retrying in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # One rolling backup generation of the previous private state, mirroring the local
          # data/*.bak convention. Uploaded from the local pre-run copy made in the download step
          # rather than an R2 server-side object copy. Best-effort only: the download step already
          # fails the job closed when state/marketsentinel.db does not exist, so a genuinely first
          # run never reaches here, but a transient failure of this particular upload should not
          # block the checkpoint that matters. Only done here, not in the second checkpoint below
          # -- this is the one rolling generation of "state before this run touched anything".
          retry aws s3 cp data/marketsentinel.db.bak "$BUCKET/state/marketsentinel.db.bak" \
            --endpoint-url "$ENDPOINT" || true

          # These two must succeed. This is the durable save of what public-request admission just
          # paid for -- everything after this step depends on it having actually happened.
          retry aws s3 cp data/marketsentinel.db "$BUCKET/state/marketsentinel.db" \
            --endpoint-url "$ENDPOINT"
          retry aws s3 cp data/constituents_cache.json "$BUCKET/state/constituents_cache.json" \
            --endpoint-url "$ENDPOINT"

      # Only after that checkpoint: a consumed request whose result was not durably saved must
      # stay queued so the next run redoes it (idempotently -- activation is idempotent and a
      # stored analysis is reused, never re-paid). Deletes exactly the keys the admission step
      # consumed, never the whole prefix, so requests that arrived during this run survive. A
      # single failed delete is not fatal: that request is merely admitted again next run.
      - name: Delete consumed public requests from R2
        if: ${{ env.R2_REQUESTS_BUCKET != '' && hashFiles('requests-consumed.txt') != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ env.R2_REQUESTS_BUCKET }}"
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            aws s3 rm "$BUCKET/$key" --endpoint-url "$ENDPOINT" \
              || echo "::warning::could not delete consumed request $key; it will be re-admitted"
          done < requests-consumed.txt

      # Every actively covered ticker (the always-on TICKERS plus everything admitted from public
      # requests), never-cycled first then least recently attempted, so MAX_TICKERS makes a capped
      # run round-robin across runs. MAX_NEW_TOTAL is the hard ceiling on paid cycle analyses in
      # this run regardless of how many companies are covered.
      - name: Run bounded coverage cycle
        env:
          MARKETSENTINEL_LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run python scripts/run_coverage_cycle.py --all-active \
            --max-new "$MAX_NEW" --max-new-total "$MAX_NEW_TOTAL" --max-tickers "$MAX_TICKERS"

      - name: List covered tickers
        id: covered
        run: |
          COVERED=$(uv run python scripts/run_coverage_cycle.py --mode list-active)
          echo "covered=$COVERED" >> "$GITHUB_OUTPUT"
          echo "covered tickers: $COVERED"

      # Gate: a database that fails its own consistency check must never be checkpointed to R2,
      # built into a public snapshot, or reach the public deployment. A non-zero exit here stops
      # the job -- every step below is skipped automatically.
      - name: Validate private database integrity (after the coverage cycle)
        run: uv run python scripts/check_database_integrity.py data/marketsentinel.db

      # Checkpoint immediately after a validated coverage cycle, before any public snapshot work.
      # This run's paid Stage A/B/C analyses exist only on the ephemeral runner's disk until this
      # step durably persists them to R2; if public snapshot build/scan/publish failed *before*
      # this checkpoint, the next run would re-download the pre-cycle database from R2 and could
      # pay for the same analyses again. Retried, and gated: a checkpoint failure after retries
      # stops the job here, so public snapshot build/scan/publish and the Render restart below
      # never run against work that was not actually saved. (Public-request admission's own work,
      # if any, was already durably checkpointed above, before this step even ran.)
      - name: Checkpoint private state to R2 (after the coverage cycle)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_PRIVATE_BUCKET }}"

          retry() {
            local attempt=1 max_attempts=5 delay=5
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::command failed after $max_attempts attempts: $*"
                return 1
              fi
              echo "attempt $attempt/$max_attempts failed, retrying in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # The rolling .bak generation belongs to whichever checkpoint in this run is the first
          # one to actually execute: when a request bucket is configured that was the checkpoint
          # right after public-request admission, above, so this step must not repeat it; when
          # none is configured that earlier step never ran (it is gated the same way admission
          # itself is), so this is this run's only checkpoint and it is the one that must do it.
          if [ -z "$R2_REQUESTS_BUCKET" ]; then
            retry aws s3 cp data/marketsentinel.db.bak "$BUCKET/state/marketsentinel.db.bak" \
              --endpoint-url "$ENDPOINT" || true
          fi

          # These two must succeed. This is the durable save of the analyses this run just paid
          # for -- everything after this step depends on it having actually happened.
          retry aws s3 cp data/marketsentinel.db "$BUCKET/state/marketsentinel.db" \
            --endpoint-url "$ENDPOINT"
          retry aws s3 cp data/constituents_cache.json "$BUCKET/state/constituents_cache.json" \
            --endpoint-url "$ENDPOINT"

      # Gated the same way: publish_public_snapshot.py refuses (exit 1) and writes neither
      # latest.json nor version.txt if the sanitized snapshot fails its own integrity check or the
      # secret/personal-data scan, so a bad build can never be uploaded.
      - name: Build sanitized public snapshot
        run: |
          uv run python scripts/publish_public_snapshot.py \
            --database data/marketsentinel.db \
            --constituent-cache data/constituents_cache.json \
            --output-dir dist/public-snapshot \
            --public-base-url "${{ vars.R2_PUBLIC_BASE_URL }}" \
            --tickers "${{ steps.covered.outputs.covered }}"

      # The versioned, immutable snapshot files upload first; latest.json -- the only object a
      # reader treats as mutable -- uploads last, and only if those succeeded. A reader can then
      # never observe a manifest pointing at an object that is not there yet, and a failure here
      # leaves the previously published latest.json (and the snapshot it points to) untouched.
      - name: Publish public snapshot
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_PUBLIC_BUCKET }}"
          VERSION=$(cat dist/public-snapshot/version.txt)
          aws s3 cp "dist/public-snapshot/$VERSION/public-snapshot.db" \
            "$BUCKET/snapshots/$VERSION/public-snapshot.db" --endpoint-url "$ENDPOINT"
          aws s3 cp "dist/public-snapshot/$VERSION/constituents_cache.json" \
            "$BUCKET/snapshots/$VERSION/constituents_cache.json" --endpoint-url "$ENDPOINT"
          aws s3 cp dist/public-snapshot/latest.json "$BUCKET/latest.json" \
            --endpoint-url "$ENDPOINT"

      # Restart, not redeploy: the image is unchanged, only the R2-published snapshot is new.
      # marketsentinel.public_snapshot runs again on container start and fetches it.
      - name: Restart Render service
        run: |
          curl -sf -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/restart" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"
